<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Management App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <p class="eyebrow">YOUR PERSONAL SPACE</p>
            <h1>My Notes</h1>
            <p class="subtitle">Capture your ideas, one note at a time.</p>
        </header>

        <form id="noteForm" class="editor">
            <input type="hidden" id="noteId">
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="e.g. Project ideas" maxlength="120" required>
            <label for="content">Note</label>
            <textarea id="content" placeholder="Write something worth remembering..." required></textarea>
            <div class="form-actions">
                <button type="submit" id="saveButton">＋ Add note</button>
                <button type="button" id="cancelButton" class="secondary" hidden>Cancel</button>
            </div>
        </form>

        <div class="notes-heading">
            <h2>Your notes</h2>
            <span id="noteCount">0 notes</span>
        </div>
        <div id="notesList" class="notes-grid"></div>
        <p id="message" role="status" aria-live="polite"></p>
        <footer>Notes Management App · Built with Java and Spring Boot</footer>
    </main>
    <script src="app.js"></script>
</body>
</html>
